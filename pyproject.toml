[project]
name = "ai-market-intelligence"
version = "0.1.0"
description = "AI-assisted market-intelligence and options decision-support system"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb==1.5.4",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "openai>=1.99.0",
]

[project.optional-dependencies]
# Development and test installation. It includes the dashboard dependency so
# the complete test suite (including the Streamlit AppTest render tests) runs
# from a fresh `pip install -e ".[dev]"`. Keep the Streamlit range identical
# to the `dashboard` extra (enforced by test_packaging_dependencies.py).
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "streamlit>=1.40,<2",
]
# The offline, synthetic dashboard prototype only (market_intelligence/dashboard/app.py).
# Optional: a normal library installation does not install Streamlit.
dashboard = [
    "streamlit>=1.40,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["market_intelligence*"]

[tool.pytest.ini_options]
testpaths = ["market_intelligence/tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
